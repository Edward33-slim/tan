name: materialize-keyboards10
on:
  push:
    branches: [main]
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore KeyboardView.kt
        env:
          PAYLOAD: 
        run: |
          echo "$PAYLOAD" | base64 -d | gzip -d > keyboards10/app/src/main/java/com/keyboards10/KeyboardView.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keyboards10/app/src/main/java/com/keyboards10/KeyboardView.kt .github/workflows/materialize.yml
          git rm .github/workflows/materialize.yml
          git commit -m "Add KeyboardView.kt"
          git push
