name: Build MyChatAi 4.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build complete APK
        run: gradle assembleDebug --no-daemon

      - name: Locate and rename APK
        shell: bash
        run: |
          set -e
          echo "Debug output:"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -print
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" MyChatAi-4.4.apk
          ls -lh MyChatAi-4.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChatAi-4.4
          path: MyChatAi-4.3.apk
          retention-days: 90
