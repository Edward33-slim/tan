name: Build MyChatAi 4.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MYCHATAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: GitHub secret MYCHATAI_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mychatai-release.jks"

      - name: Build signed release APK
        env:
          MYCHATAI_KEYSTORE_PATH: ${{ runner.temp }}/mychatai-release.jks
          MYCHATAI_STORE_PASSWORD: ${{ secrets.MYCHATAI_STORE_PASSWORD }}
          MYCHATAI_KEY_ALIAS: ${{ secrets.MYCHATAI_KEY_ALIAS }}
          MYCHATAI_KEY_PASSWORD: ${{ secrets.MYCHATAI_KEY_PASSWORD }}
        run: |
          if [ -z "$MYCHATAI_STORE_PASSWORD" ] || [ -z "$MYCHATAI_KEY_ALIAS" ] || [ -z "$MYCHATAI_KEY_PASSWORD" ]; then
            echo "ERROR: Permanent signing secrets are incomplete."
            exit 1
          fi
          gradle assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MyChatAi-4.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChatAi-4.1
          path: MyChatAi-4.1.apk
          retention-days: 90
