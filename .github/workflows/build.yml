name: Build Android APK

on:
  push:
    paths:
      - 'keyboards10/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyboards10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: keyboards10-debug-apk-${{ github.run_number }}
          path: keyboards10/app/build/outputs/apk/debug/*.apk
          archive: true
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "keyboards10-${{ github.run_number }}.apk"
          gh release create "v0.1.${{ github.run_number }}" "keyboards10-${{ github.run_number }}.apk"             --title "Keyboard10 Build ${{ github.run_number }}"             --notes "Android keyboard APK built automatically from the main branch."
