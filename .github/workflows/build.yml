name: Build MyChatAi 4.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build complete APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MyChatAi-4.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChatAi-4.2
          path: MyChatAi-4.2.apk
          retention-days: 90
